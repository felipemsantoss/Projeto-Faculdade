name: Publicar no GitHub Pages

# O Pages serve apenas arquivos estáticos, então aqui vai só o front, com
# VITE_DEMO ligado: nessa versão o próprio navegador responde no lugar da API
# Express (veja src/services/demoApi.ts). O back continua existindo para quem
# roda o projeto localmente com `npm run dev`.

on:
  push:
    branches: [main]
  # Permite publicar manualmente pela aba Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se houver outra em andamento, ela termina primeiro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos (front e API)
        run: npm run typecheck

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construir o site
        env:
          # O site fica em /<repositório>/, não na raiz do domínio.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_DEMO: '1'
        run: npx vite build

      - name: Enviar o resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
